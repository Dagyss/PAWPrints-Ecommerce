<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carrito de compras en PAWPrints. Revisa y administra los productos agregados a tu carrito.">
    <meta name="keywords" content="PAWPrints, carrito de compras, libros, ebooks, productos">
    <meta name="author" content="PAWPrints">
    <title>Carrito de Compras - PAWPrints</title>
</head>
<body>

    <section role="dialog" aria-labelledby="cart-title">
        <header>
            <h2>Carrito de Compras</h2>
        </header>
        <ul>
            <li>
                <article>
                    <figure>
                        <img src="image-placeholder.jpg" alt="Imagen del producto">
                    </figure>
                    <h3>Título del Producto</h3>
                    <label for="quantity1">Cantidad:</label>
                    <input type="number" name="quantity1" min="1" value="1">
                    <p>Precio: $xxxxxxxx</p>
                    <button type="button" aria-label="Eliminar producto"><img src="../icons/trash.png" alt=""></button>
                </article>
            </li>
            <li>
                <article>
                    <figure>
                        <img src="image-placeholder.jpg" alt="Imagen del producto">
                    </figure>
                    <h3>Título del Producto</h3>
                    <label for="quantity2">Cantidad:</label>
                    <input type="number" name="quantity2" min="1" value="1">
                    <p>Precio: $xxxxxxxx</p>
                    <button type="button" aria-label="Eliminar producto"><img src="../icons/trash.png" alt=""></button>
                </article>
            </li>
            <li>
                <article>
                    <figure>
                        <img src="image-placeholder.jpg" alt="Imagen del producto">
                    </figure>
                    <h3>Título del Producto</h3>
                    <label for="quantity3">Cantidad:</label>
                    <input type="number" name="quantity3" min="1" value="1">
                    <p>Precio: $xxxxxxxx</p>
                    <button type="button" aria-label="Eliminar producto"><img src="../icons/trash.png" alt=""></button>
                </article>
            </li>
        </ul>

        <footer>
            <h3>Total:</h3>
            <p>$X,XXX.XX</p>
            <button type="button">Finalizar compra</button>
        </footer>
    </section>

</body>
</html>
